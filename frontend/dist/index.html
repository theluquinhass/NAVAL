<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const root = document.documentElement
        const preferences = ['light', 'dark', 'system']
        let preference = 'system'

        try {
          const savedPreference = window.localStorage.getItem('naval-theme-preference')
          if (preferences.includes(savedPreference)) preference = savedPreference
        } catch {
          // Storage can be unavailable; use the system preference instead.
        }

        const prefersDark = typeof window.matchMedia === 'function'
          && window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference

        root.dataset.themePreference = preference
        root.dataset.theme = theme
      })()
    </script>
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <title>naval</title>
    <script type="module" crossorigin src="/assets/index-DJoh8ltS.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CT9hEDlM.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
